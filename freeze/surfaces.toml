# `required` lists the surfaces that must have a row when a release is made.
# `just freeze-check` prints a notice for a listed surface without a row; the
# `release` recipe fails on it. A row's name must be listed here, and this key
# must stay above the first `[[surface]]` table.
required = []

# Baseline rows for the freeze check. Each row names a frozen surface and the
# git ref its dump is compared against:
#
#   [[surface]]
#   name = "keywords"
#   baseline = "v0.10.0"
#
# Without a row, a line-dump surface is only checked against its committed
# dump, `generated-crate` is only checked for equality with a regeneration, and
# `runtime-crates` is not checked.
