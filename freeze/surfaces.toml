# Baseline rows for the freeze check. Each row names a frozen surface and the
# git ref its dump is compared against:
#
#   [[surface]]
#   name = "keywords"
#   baseline = "v0.10.0"
#
# Without a row, a line-dump surface is only checked against its committed
# dump, `generated-crate` is only checked for equality with a regeneration, and
# `runtime-crates` is not checked.
