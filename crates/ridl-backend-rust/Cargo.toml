[package]
name = "ridl-backend-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
ridl-ir.workspace = true
serde.workspace = true
syn.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile = "3.15.0"
# The source-to-IR compile path for the descriptor tests
# (tests/support/ir.rs uses `ridlc::compile`). ridlc depends on this crate as
# a normal dependency, so this is a dev-dependency cycle back to the crate
# under test. Cargo supports it: a dev-dependency is not part of the graph
# used to build this crate as a library, only of the graph used to build its
# own test binaries, so the `ridlc` this pulls in links against the ordinary
# (non-test) build of this crate.
ridlc.workspace = true
# `ridl_core` is not reached only through `ridlc`: the compile helper names
# nothing from it today, but it is added alongside `ridlc` to match the
# sibling proto backend's documented dev-dependency set for the same
# source-to-IR path, so a later descriptor test that constructs a
# `RidlDatabase` itself has the crate available.
ridl-core.workspace = true
# The in-process reference runtime the round-trip tests build the generated
# face over (story E11.15). A dev-dependency for the same reason as `ridl-rt`
# below: the backend emits text that links a runtime and links none itself.
ridl-loopback.workspace = true
# The generated interaction face names `::ridl_rt` (Lane M stage M3). The
# backend itself emits text that links `ridl-rt` and does not link it, so this
# is a dev-dependency only: the integration tests that compile the checked-in
# generated face need it, for the vocabulary the face names and for the port
# traits the round trip calls.
# The `flatbuffers` feature is what makes `::ridl_rt::flatbuffers` exist, and
# the generated codec the face is compiled over names it at every read and
# every write. It is enabled here, on the dev-dependency, and nowhere else:
# this crate's library links no runtime at all.
ridl-rt = { workspace = true, features = ["flatbuffers"] }
# The independent FlatBuffers implementation the conformance test round trips
# against (E11.7 design note D-8), and the code generator that turns the
# emitted `.fbs` into the Rust reader that test drives. `planus-codegen` runs
# in one test, which regenerates the checked-in reader and asserts it is byte
# for byte what is in the tree; `planus` is the runtime that reader links, in
# this test binary only. Neither is a dependency of anything this workspace
# ships or anything a generated package links.
# The `.fbs` the conformance test compiles with planus is emitted from the
# same IR as the codec under test, by the schema backend, so the two agree by
# construction rather than through a checked-in schema that could drift. A
# dev-dependency only: nothing in this crate's library links it, and ADR-0020
# decision 9's rule that a backend is not a library other crates link is
# about the shipped graph, not about a test binary.
ridl-backend-flatbuffers.workspace = true
planus.workspace = true
planus-codegen.workspace = true
planus-translation.workspace = true
