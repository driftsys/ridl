[package]
name = "ridl-backend-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Compiles a RIDL IR package to Rust source, plus the generated interaction face."

[features]
# Not a feature of the backend: the library reads nothing under it. The
# checked-in generated face is `include!`d by the round-trip tests, and its
# `blocking` module is under `#[cfg(feature = "std")]`, which rustc evaluates
# against the crate that includes it, this one. Naming the feature here, on by
# default, is what compiles that module in the tests (second
# half).
default = ["std"]
std = []

[dependencies]
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
ridl-ir.workspace = true
serde.workspace = true
syn.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile = "3.15.0"
# The source-to-IR compile path for the descriptor tests
# (tests/support/ir.rs uses `ridlc::compile`). ridlc depends on this crate as
# a normal dependency, so this is a dev-dependency cycle back to the crate
# under test. Cargo supports it: a dev-dependency is not part of the graph
# used to build this crate as a library, only of the graph used to build its
# own test binaries, so the `ridlc` this pulls in links against the ordinary
# (non-test) build of this crate.
#
# Not `ridlc.workspace = true`: that pulls in the workspace entry's version
# alongside the path, and cargo only strips a dev-dependency on a workspace
# member at packaging time when it carries no version — so a versioned one
# here would need `ridlc` already published before this crate can be, while
# `ridlc` normal-depends on this crate and so needs the reverse. A plain path
# with no version is what keeps that cycle harmless; the same reasoning holds
# for every other internal dev-dependency below.
ridlc = { path = "../ridlc" }
# `ridl_core` is not reached only through `ridlc`: the compile helper names
# nothing from it today, but it is added alongside `ridlc` to match the
# sibling proto backend's documented dev-dependency set for the same
# source-to-IR path, so a later descriptor test that constructs a
# `RidlDatabase` itself has the crate available.
ridl-core = { path = "../ridl-core" }
# The in-process reference runtime the round-trip tests build the generated
# face over. A dev-dependency for the same reason as `ridl-rt`
# below: the backend emits text that links a runtime and links none itself.
ridl-loopback = { path = "../ridl-loopback" }
# The generated interaction face names `::ridl_rt`. The
# backend itself emits text that links `ridl-rt` and does not link it, so this
# is a dev-dependency only: the integration tests that compile the checked-in
# generated face need it, for the vocabulary the face names and for the port
# traits the round trip calls.
# The `flatbuffers` feature is what makes `::ridl_rt::flatbuffers` exist, and
# the generated codec the face is compiled over names it at every read and
# every write. It is enabled here, on the dev-dependency, and nowhere else:
# this crate's library links no runtime at all.
# The `std` feature is what makes `::ridl_rt::task` exist: the round trips
# through the generated async client poll its futures by hand with
# `ridl_rt::task::noop_waker`, the way a frame loop does.
ridl-rt = { path = "../ridl-rt", features = ["flatbuffers", "std"] }
# The independent FlatBuffers implementation the conformance test round trips
# against (design note D-8), and the code generator that turns the
# emitted `.fbs` into the Rust reader that test drives. `planus-codegen` runs
# in one test, which regenerates the checked-in reader and asserts it is byte
# for byte what is in the tree; `planus` is the runtime that reader links, in
# this test binary only. This crate's own use of both is dev-only. The
# toolchain may depend on planus (`ridl-descriptor` does); `ridl-rt` and every
# generated package must not (ADR-0020 decision 5, as amended 2026-10-03).
# The `.fbs` the conformance test compiles with planus is emitted from the
# same IR as the codec under test, by the schema backend, so the two agree by
# construction rather than through a checked-in schema that could drift. A
# dev-dependency only: nothing in this crate's library links it, and ADR-0020
# decision 9's rule that a backend is not a library other crates link is
# about the shipped graph, not about a test binary.
ridl-backend-flatbuffers = { path = "../ridl-backend-flatbuffers" }
# The conformance test that ties the codec's reading of an absent field to the
# verdict `ridl diff` gives the append that makes the field absent
# (driftsys/ridl#598) runs the crate that owns that verdict. A dev-dependency
# only, as it is for `ridl-backend-flatbuffers`'s stability property.
ridl-diff = { path = "../ridl-diff" }
planus.workspace = true
planus-codegen.workspace = true
planus-translation.workspace = true
# The propagation hook spike. The design of generated observation gives
# `ridl_rt::trace::Propagation` to the application, and the tests in
# `otel_propagation.rs` prove the hook's call order by implementing it with
# `tracing-opentelemetry` over an in-memory exporter, then reading the exported
# spans back. `opentelemetry` and `opentelemetry_sdk` follow the version
# `tracing-opentelemetry` declares in its own manifest. Dev-dependencies only: the backend's library links none of
# them, and neither does `ridl-rt`.
opentelemetry = { version = "0.33", default-features = false, features = [
  "trace",
] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
  "trace",
  "testing",
] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "registry",
  "std",
] }
