[package]
name = "ridl-loopback"
version.workspace = true
# Edition 2021 and rust-version 1.88 as literals, the same as `ridl-rt`.
# `just compat-check` builds the packaged crate at this minimum.
edition = "2021"
rust-version = "1.88"
license.workspace = true
repository.workspace = true
description = "The in-process reference runtime: an implementation of ridl-rt's port traits over one in-memory store."
# The package leaves out `tests/conformance.rs`: the dev-dependency below has
# no version, so `cargo package` drops it from the packaged manifest, and the
# test would be a test target that cannot compile. The node test also reads
# the conformance fixture outside this package. Both run in the workspace.
exclude = ["tests/conformance.rs", "tests/node.rs"]

[features]
node = ["dep:ridl-descriptor"]
debug = ["node", "ridl-rt/debug"]

[dependencies]
ridl-rt.workspace = true
ridl-descriptor = { workspace = true, optional = true }

[[test]]
name = "node"
path = "tests/node.rs"
required-features = ["node"]

# The port contract suite, which `tests/conformance.rs` runs
# over this runtime. A plain path with no version, so that packaging this crate
# does not need a registry copy of `ridl-rt-conformance` at this version, which
# exists only after the release has published it. `cargo package` drops a
# dev-dependency that has no version.
[dev-dependencies]
ridl-rt-conformance = { path = "../ridl-rt-conformance" }

# The freeze check denies the major-level lints that cargo-semver-checks only
# warns about by default (`[workspace.metadata.cargo-semver-checks.lints]`).
[package.metadata.cargo-semver-checks.lints]
workspace = true
