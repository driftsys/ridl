[package]
name = "streams.demo"
version = "1.0.0"

[backend.rust]
encodings = ["flatbuffers"]

[backend.typescript]
codec = true

[limits.interaction]
"Feed.readBytes" = 512
"Feed.zero" = 64

"Feed.upload" = 64
"Feed.uploadNamed" = 512
"Feed.uploadData" = 512
"Feed.uploadText" = 64
"Feed.uploadChoice" = 512
