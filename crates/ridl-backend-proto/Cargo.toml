[package]
name = "ridl-backend-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ridl-ir = { path = "../ridl-ir" }

# protox is TEST-ONLY and must stay here. It is the validity check of
# ADR-0016's totality property, not part of emission: making it a normal
# dependency would put a protobuf compiler in every build and break
# `just wasm-check`.
[dev-dependencies]
insta.workspace = true
protox.workspace = true
# The source-to-IR compile path for tests/corpus.rs (`ridlc::compile`) —
# ridlc depends on this crate as a normal dependency, so this is a
# dev-dependency cycle back to the crate under test. Cargo supports this: a
# dev-dependency is not part of the graph used to build this crate as a
# library, only of the graph used to build its own test binaries, so the
# `ridlc` this pulls in links against the ordinary (non-test) build of this
# crate.
ridlc = { path = "../ridlc" }
tempfile = "3.15.0"
