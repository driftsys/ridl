[package]
name = "ridl-descriptor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The catalog descriptor an engine reads: schema, generated accessors, verifier"

[features]
default = ["std"]
# With `std` off the crate is `no_std` with `alloc` and keeps what an engine
# that reads a descriptor needs: the generated accessors, `verify`, `finish`
# and the constants. The modules that build a descriptor from the IR or
# render one (`lower`, `number`, `hash`, `describe`) and their dependencies
# `ridl-ir` and `serde_json` need the standard library and come with `std`.
std = ["dep:ridl-ir", "dep:serde_json", "planus/std", "serde/std"]

[dependencies]
# The IR the descriptor is built from: the interface numbers `ridl-sem` folds
# into it are read from here (`number.rs`). With `std` only.
ridl-ir = { workspace = true, optional = true }
# The FlatBuffers runtime the generated accessors call into. The schema
# compiler (planus-translation, planus-codegen) is an xtask dependency only:
# the accessors are generated by `cargo xtask descriptor-codegen` and committed.
# The workspace entry leaves its default features off; the three caches are
# the builder's lookup tables, which need no standard library, and its `std`
# comes with this crate's `std`.
planus = { workspace = true, features = [
  "vtable-cache",
  "string-cache",
  "bytes-cache",
] }
# planus derives `Serialize` and `Deserialize` on every owned table and enum
# it generates, with no option to turn that off, so the accessors do not
# compile without serde. Declared here rather than inherited, because the
# workspace's `serde` has its default features on and Cargo ignores
# `default-features = false` on an inherited entry. `alloc` and `derive` are
# what the generated code needs; `std` comes with this crate's `std`.
serde = { version = "1.0.228", default-features = false, features = [
  "alloc",
  "derive",
] }
# `describe::to_json` builds the JSON view `ridl describe` prints. With `std`
# only.
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# The codec agreement test (`tests/codec_agreement.rs`) runs the Rust backend
# in process and checks every `MAX_SIZE` it writes against the FlatBuffers
# size state this crate advertises for the same type. A plain path with no
# version, not `.workspace = true`: cargo strips a dev-dependency on a
# workspace member at packaging time only when it carries no version, and
# `ridl-backend-rust` publishes after this crate. The reasoning is written
# out above `ridlc` in `crates/ridl-backend-rust/Cargo.toml`.
ridl-backend-rust = { path = "../ridl-backend-rust" }
