[package]
name = "ridl-sem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The RIDL family per-profile semantic passes: the package resolver and the package checker."

[dependencies]
num-bigint.workspace = true
num-rational.workspace = true
# `testgen` ships proptest strategies derived from a checked range (the "typl
# ranges are generators" feature). proptest is an OPTIONAL dependency
# gated behind the default-on `testgen` feature: proptest pulls in
# `rand`/`getrandom`, which does not compile for wasm32-unknown-unknown, so the
# `--no-default-features` compiler-crate check must be able to drop it
# (ADR-0007 decision 5, the same discipline the fs/fetch gates follow). The
# `std` feature is all the strategy builders and the test runner need.
proptest = { workspace = true, features = ["std"], optional = true }
# The doc scanner (`docs.rs`) reads a doc comment as CommonMark to find the
# link candidates outside code spans and fenced blocks (ADR-0026). The
# workspace entry turns the default features off; the parser alone builds
# for wasm32-unknown-unknown.
pulldown-cmark.workspace = true
regress.workspace = true
# A pattern is also compiled with `regex`, the crate the Rust backend's
# generated code compiles it with, so a pattern that crate refuses is TYPL-220
# rather than a panic in the consumer's process (issue #437). Not `regex-syntax`
# alone: it parses a pattern but does not apply the compiled-size limit. The
# default features stay on, as in the generated crate's dependency, because
# they decide which Unicode classes compile. `regex` builds for
# wasm32-unknown-unknown with them.
regex.workspace = true
# ridl-sem only uses ridl-core's db/diag/package/std_lib modules, none of
# which sit behind the fs/fetch features, so the default features (fetch,
# which implies fs) are turned off here. Leaving the default on would pull
# `ureq` (and transitively `ring`) into the wasm32-unknown-unknown build
# even with `--no-default-features` on ridl-sem itself (ADR-0007 decision 5).
# Not `{ workspace = true, default-features = false }`: cargo refuses a
# `default-features = false` override on a workspace-inherited dependency
# outright, so this one dependency is declared directly instead. The version
# is the one literal in the workspace outside `[workspace.dependencies]` —
# bump it alongside `[workspace.package].version` in the root `Cargo.toml`.
ridl-core = { path = "../ridl-core", version = "0.7.0", default-features = false }
ridl-ir.workspace = true
ridl-syntax.workspace = true
rowan.workspace = true
salsa.workspace = true

[features]
# `testgen` ships by default; the wasm check turns it off with
# `--no-default-features` so proptest (and its wasm-hostile `getrandom`) never
# enters that build.
default = ["testgen"]
testgen = ["dep:proptest"]

[dev-dependencies]
insta.workspace = true
# proptest is also a dev-dependency so the crate's own tests (scalar.rs's
# property tests, gated by `#[cfg(test)]` only) compile regardless of the
# `testgen` feature — in particular under `--no-default-features`, where the
# optional normal dependency above is turned off. Dev-dependencies are not
# built by `cargo check`, so this does not re-enter the wasm build. The
# workspace pins default-features off, so `std` is requested here explicitly.
proptest = { workspace = true, features = ["std"] }
# tests/manifest_version.rs reads this crate's own Cargo.toml and the
# workspace root's, to guard the one hand-written version literal in this
# crate's manifest against drifting from [workspace.package].version.
serde = { workspace = true }
toml.workspace = true
