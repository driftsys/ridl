[package]
name = "ridl-sem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
num-bigint.workspace = true
num-rational.workspace = true
# `testgen` ships proptest strategies derived from a checked range (the "typl
# ranges are generators" feature, E1.18). proptest is an OPTIONAL dependency
# gated behind the default-on `testgen` feature: proptest pulls in
# `rand`/`getrandom`, which does not compile for wasm32-unknown-unknown, so the
# E1.19 `--no-default-features` compiler-crate check must be able to drop it
# (ADR-0007 decision 5, the same discipline the fs/fetch gates follow). The
# `std` feature is all the strategy builders and the test runner need.
proptest = { workspace = true, features = ["std"], optional = true }
# ridl-sem only uses ridl-core's db/diag/package/std_lib modules, none of
# which sit behind the fs/fetch features, so the default features (fetch,
# which implies fs) are turned off here. Leaving the default on would pull
# `ureq` (and transitively `ring`) into the wasm32-unknown-unknown build
# even with `--no-default-features` on ridl-sem itself (ADR-0007 decision 5,
# E1.19).
regress.workspace = true
ridl-core = { path = "../ridl-core", default-features = false }
ridl-ir = { path = "../ridl-ir" }
ridl-syntax = { path = "../ridl-syntax" }
rowan.workspace = true
salsa.workspace = true

[features]
# `testgen` ships by default; the wasm check turns it off with
# `--no-default-features` so proptest (and its wasm-hostile `getrandom`) never
# enters that build.
default = ["testgen"]
testgen = ["dep:proptest"]

[dev-dependencies]
insta.workspace = true
