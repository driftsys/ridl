[package]
name = "ridl-transport-ws"
version.workspace = true
# Edition 2021 and rust-version 1.83 as literals, the same as `ridl-rt`:
# edition 2024 cannot build before Rust 1.85.
edition = "2021"
rust-version = "1.83"
license.workspace = true
repository.workspace = true
description = "The WebSocket binding of the ridl frame: a no_std codec and a server for ridl-rt ports."
# The package leaves out `tests/`: a path dev-dependency carries no version, as
# in `ridl-loopback`, so `cargo package` drops it from the packaged manifest and
# a test that uses it would be a test target that cannot compile. The tests run
# here, in the workspace.
exclude = ["tests/"]

[features]
default = ["server"]
# The server side of the binding. It turns on `std` for this crate and nothing
# else; it turns on no `ridl-rt` feature.
server = []

[dependencies]
ridl-rt.workspace = true
