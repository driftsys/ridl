[package]
name = "ridl-rt"
version.workspace = true
# The crate compiles as edition 2021 because its rust-version minimum (1.83)
# predates edition 2024, which Rust cannot build before 1.85; source ridl
# emits, copied or generated into a consuming crate, compiles as that crate's
# own edition. `just compat-check` also tests this crate as edition 2024 with
# the toolchain pin.
edition = "2021"
license.workspace = true
repository.workspace = true
description = "The vocabulary that code generated from ridl and a runtime agree on: identity, time, the envelope, samples, payload traits, interaction descriptors, ports, and contract and transport errors."
readme = "README.md"
keywords = ["ridl", "idl", "runtime", "embedded", "reactive"]
categories = ["no-std", "encoding"]
# The oldest Rust this crate supports. `just compat-check` builds and tests
# the crate with that toolchain; the newest tested is the rust-toolchain.toml
# pin.
rust-version = "1.83"

# One feature per payload encoding (ADR-0020 decision 5). In this version
# `flatbuffers` enables the module of the same name, `proto3` and `repr-c`
# enable nothing, and the crate has no dependency in any combination.
# `std` is not an encoding: it links the standard library and enables the
# `task` module (ADR-0021 decision 8, amended 2026-09-26; story E11.17).
[features]
flatbuffers = []
proto3 = []
repr-c = []
std = []

# docs.rs builds with every feature on, so the crate docs' links to the
# `flatbuffers` and `task` modules resolve.
[package.metadata.docs.rs]
all-features = true
