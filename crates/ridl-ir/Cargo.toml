[package]
name = "ridl-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The RIDL intermediate representation: the typl surface plus the ridl interaction layer, generated from a versioned protobuf schema."

[dependencies]
# The exact decimal arithmetic of `step::prepare_float_step`.
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
# The runtime the pbjson-generated serde impls call into (ADR-0014
# decision 14).
pbjson.workspace = true
prost.workspace = true
prost-reflect.workspace = true
# `from_json` builds its depth-cap error through `serde::de::Error::custom`
# (ADR-0014 decision 14).
serde.workspace = true
# `unbounded_depth` exposes `Deserializer::disable_recursion_limit`, which
# `from_json` needs: serde_json's own limit of 128 JSON levels would bind
# before the crate's documented ceiling of 1,000 (ADR-0014 decision 14).
serde_json = { workspace = true, features = ["unbounded_depth"] }
# `catalog_hash` is SHA-256 over the protobuf binary of the reduced package
# (ADR-0014 decision 15).
sha2.workspace = true

[dev-dependencies]
# Compile the agreement table through the real checker before model lowering.
# Path only, with no version, so `cargo publish` removes them and they set no
# order in the publish list.
ridl-core = { path = "../ridl-core" }
ridl-sem = { path = "../ridl-sem" }
regex.workspace = true
tempfile = "3.15.0"

[build-dependencies]
pbjson-build.workspace = true
prost.workspace = true
prost-build.workspace = true
protox.workspace = true
