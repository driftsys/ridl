# The RIDL language server (docs/ROADMAP.md epic E1.15, ADR-0004 §6):
# a synchronous `lsp-server` loop over the same salsa database `ridlc`
# compiles with. The crate is a library plus a thin `ridl-lsp` binary so
# the integration tests can drive the server over an in-memory connection.

[package]
name = "ridl-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lsp-server.workspace = true
lsp-types.workspace = true
ridl-core = { path = "../ridl-core" }
ridl-sem = { path = "../ridl-sem" }
ridl-syntax = { path = "../ridl-syntax" }
rowan.workspace = true
salsa.workspace = true
serde_json.workspace = true
