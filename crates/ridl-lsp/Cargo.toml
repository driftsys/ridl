# The RIDL language server (docs/ROADMAP.md epic E1.15, ADR-0004 §6):
# a synchronous `lsp-server` loop over the same salsa database `ridlc`
# compiles with. The crate is a library; the `ridl` CLI hosts it as
# `ridl lsp`. The integration tests in `tests/server.rs` drive
# `ridl_lsp::server::run` directly on a thread, over an in-memory connection.

[package]
name = "ridl-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lsp-server.workspace = true
lsp-types.workspace = true
ridl-core.workspace = true
ridl-ir.workspace = true
ridl-sem.workspace = true
ridl-syntax.workspace = true
rowan.workspace = true
salsa.workspace = true
serde_json.workspace = true
