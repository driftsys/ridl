[package]
name = "ridlc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
ridl-backend-flatbuffers = { path = "../ridl-backend-flatbuffers" }
ridl-backend-proto = { path = "../ridl-backend-proto" }
ridl-backend-rust = { path = "../ridl-backend-rust" }
ridl-backend-ts = { path = "../ridl-backend-ts" }
ridl-core = { path = "../ridl-core" }
ridl-ir = { path = "../ridl-ir" }
ridl-sem = { path = "../ridl-sem" }
ridl-syntax = { path = "../ridl-syntax" }
rowan.workspace = true

[dev-dependencies]
# The `glob` feature drives the full-pipeline corpus runner (tests/corpus.rs,
# E1.18); `json` rides in from the workspace default.
insta = { workspace = true, features = ["glob"] }
