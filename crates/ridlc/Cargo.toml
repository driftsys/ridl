[package]
name = "ridlc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The `ridlc` compile pipeline as a library: source to IR to generated code."

[dependencies]
clap.workspace = true
ridl-backend-flatbuffers.workspace = true
ridl-backend-proto.workspace = true
ridl-backend-rust.workspace = true
ridl-backend-ts.workspace = true
ridl-core.workspace = true
ridl-ir.workspace = true
ridl-sem.workspace = true
ridl-syntax.workspace = true
rowan.workspace = true

[dev-dependencies]
# The `glob` feature drives the full-pipeline corpus runner (tests/corpus.rs,
# E1.18); `json` rides in from the workspace default.
insta = { workspace = true, features = ["glob"] }
serde.workspace = true
tempfile = "3.15.0"
toml.workspace = true
