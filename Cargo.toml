# RIDL compiler workspace. Every crate lives at `crates/<crate-name>/`, with
# the directory name equal to the crate name; `xtask` at the root is the one
# exception, the workspace-automation crate (`cargo xtask codegen`, ADR-0007
# decision 1). The roadmap names the crates per epic (docs/ROADMAP.md).

[workspace]
# resolver = "2", not "3": `cargo package -p ridl-rt` writes this line into
# the packaged Cargo.toml (as `[package] resolver`), and cargo 1.83 cannot
# read resolver 3 ("feature `edition2024` is required"), so a Rust 1.83 user
# could not build the published crate. Resolver 3 is also MSRV-aware: with
# ridl-rt's rust-version at 1.83, it would resolve every workspace dependency
# to versions compatible with Rust 1.83, not only ridl-rt's own (ADR-0021
# decision 10; decided by Sebastien on 2026-09-14 in driftsys/ridl#352).
resolver = "2"
members = ["crates/*", "xtask"]
# `examples/cabin` is its own workspace (`just demo`). One of its two members,
# `generated/`, is written by `ridl build --emit rust` and is not in git, so a
# member of this workspace it cannot be: every gate command would fail on a
# fresh clone until the demo had been run once.
exclude = ["examples"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/driftsys/ridl"

[workspace.dependencies]
clap = { version = "4.6.2", features = ["derive"] }
codespan-reporting = "0.13.1"
insta = { version = "1.48.0", features = ["json"] }
logos = "0.16.1"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
num-bigint = "0.4.8"
num-rational = "0.4.2"
# The IR's canonical protobuf JSON (ADR-0014 decision 14): `pbjson-build`
# generates the serde impls at build time from the same `protox` descriptor
# set that generates the types, and `pbjson` is the runtime the generated
# code calls into. Both target prost ^0.14, matching the pin below.
pbjson = "0.9.0"
pbjson-build = "0.9.0"
# The independent FlatBuffers implementation E11.7's conformance test round
# trips against (design note D-8), and the code generator that turns an
# emitted `.fbs` into the Rust reader that test drives. Both are
# dev-dependencies of `ridl-backend-rust` only; nothing this workspace ships
# and nothing a generated package links depends on either.
#
# The authority for that is the E11.7 design note's D-12, not ADR-0020
# decision 5: decision 5 *permits* one FlatBuffers runtime crate in `ridl-rt`
# under its `flatbuffers` feature. What keeps a third-party implementation
# out of the shipped path is D-12's choice to leave that permission unused,
# so ADR-0020's RA-01 dependency ceiling stays unspent. Pinned at the same
# 1.3 release line as `planus-translation` below, because the three crates
# are released together and `planus-codegen` emits code against the runtime
# of its own version.
planus = "1.3.0"
planus-codegen = "1.3.0"
# The FlatBuffers schema validity oracle for `ridl-backend-flatbuffers`'s
# tests (`crates/ridl-backend-flatbuffers/Cargo.toml`'s doc comment): a
# dev-dependency only, matching how `protox` backs the proto3 backend.
planus-translation = "1.3.0"
prettyplease = "0.2.37"
proc-macro2 = "1.0.106"
# Default features off: `testgen` (E1.18) makes proptest a normal dependency of
# ridl-sem, and the `fork`/`timeout` process machinery in the default set does
# not build for wasm32-unknown-unknown (the E1.19 `--no-default-features`
# compiler-crate check). Consumers add the `std` feature, which is all the
# strategy builders and the test runner need.
proptest = { version = "1.11.0", default-features = false }
prost = "0.14.4"
prost-build = "0.14.4"
# The reflection side of the IR encodings (ADR-0014 decision 7, amended by
# decision 14): prototext via `text-format`. JSON moved to `pbjson`-generated
# impls, so the `serde` feature is no longer needed. Depends on prost ^0.14,
# matching the pin above.
prost-reflect = { version = "0.16.5", features = ["text-format"] }
protox = "0.9.1"
# The book-example harness parses `docs/book/` with the same CommonMark parser
# mdBook uses, and with mdBook's option set, so what the harness compiles and
# what a reader sees are decided by one implementation rather than two. Only
# the parser is needed: the harness reads the event stream and never renders.
pulldown-cmark = { version = "0.13.4", default-features = false }
quote = "1.0.46"
regress = "0.11.1"
# The Model Context Protocol SDK behind `ridl mcp` (ADR-0005 Layer B,
# docs/ROADMAP.md epic E8.6). Default features off: `base64` is for content
# blocks this server never emits. `server` pulls in `schemars`, which rmcp
# re-exports as `rmcp::schemars` — deriving `JsonSchema` through that path
# keeps one `JsonSchema` trait rather than two incompatible copies.
rmcp = { version = "3.3.0", default-features = false, features = [
  "macros",
  "server",
  "transport-io",
] }
rowan = "0.16.1"
salsa = "=0.28.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
syn = { version = "2.0.119", features = ["full"] }
tar = "0.4.44"
# The async runtime the MCP SDK runs on — the first async code in this
# workspace, reached only through `ridl mcp`. `rmcp` happens to enable
# `io-std`, `rt` and `macros` today through its own feature set; naming them
# here makes them this workspace's stated requirement rather than an
# inherited side effect that a future `rmcp` release could withdraw.
# `io-std` is the stdio transport's `Stdin`/`Stdout`, `rt` the runtime that
# drives the task `rmcp` spawns, `rt-multi-thread` the flavour the `ridl`
# binary builds by hand with `tokio::runtime::Builder`
# (`crates/ridl/src/main.rs`; there is no `#[tokio::main]`), and `macros` for
# `#[tokio::test]` in `crates/ridl/tests/servers.rs`.
tokio = { version = "1.53.1", features = [
  "io-std",
  "macros",
  "rt",
  "rt-multi-thread",
] }
toml = "1.1.3"
ungrammar = "1.16.1"
ureq = "3.1.2"
