# RIDL compiler workspace. Every crate lives at `crates/<crate-name>/`, with
# the directory name equal to the crate name; `xtask` at the root is the one
# exception, the workspace-automation crate (`cargo xtask codegen`, ADR-0007
# decision 1). The roadmap names the crates per epic (docs/ROADMAP.md).

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/driftsys/ridl"

[workspace.dependencies]
clap = { version = "4.6.2", features = ["derive"] }
codespan-reporting = "0.13.1"
insta = { version = "1.48.0", features = ["json"] }
logos = "0.16.1"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
num-bigint = "0.4.8"
num-rational = "0.4.2"
# The IR's canonical protobuf JSON (ADR-0014 decision 14): `pbjson-build`
# generates the serde impls at build time from the same `protox` descriptor
# set that generates the types, and `pbjson` is the runtime the generated
# code calls into. Both target prost ^0.14, matching the pin below.
pbjson = "0.9.0"
pbjson-build = "0.9.0"
prettyplease = "0.2.37"
proc-macro2 = "1.0.106"
# Default features off: `testgen` (E1.18) makes proptest a normal dependency of
# ridl-sem, and the `fork`/`timeout` process machinery in the default set does
# not build for wasm32-unknown-unknown (the E1.19 `--no-default-features`
# compiler-crate check). Consumers add the `std` feature, which is all the
# strategy builders and the test runner need.
proptest = { version = "1.11.0", default-features = false }
prost = "0.14.4"
prost-build = "0.14.4"
# The reflection side of the IR encodings (ADR-0014 decision 7, amended by
# decision 14): prototext via `text-format`. JSON moved to `pbjson`-generated
# impls, so the `serde` feature is no longer needed. Depends on prost ^0.14,
# matching the pin above.
prost-reflect = { version = "0.16.5", features = ["text-format"] }
protox = "0.9.1"
# The book-example harness parses `docs/book/` with the same CommonMark parser
# mdBook uses, and with mdBook's option set, so what the harness compiles and
# what a reader sees are decided by one implementation rather than two. Only
# the parser is needed: the harness reads the event stream and never renders.
pulldown-cmark = { version = "0.13.4", default-features = false }
quote = "1.0.46"
regress = "0.11.1"
rowan = "0.16.1"
salsa = "=0.28.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
syn = { version = "2.0.119", features = ["full"] }
tar = "0.4.44"
toml = "1.1.3"
ungrammar = "1.16.1"
ureq = "3.1.2"
