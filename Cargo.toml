# RIDL compiler workspace. Members are the crates the roadmap names for
# epic E0 (docs/ROADMAP.md); E0.8 adds `backends/*`.

[workspace]
resolver = "3"
members = ["crates/*", "backends/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/driftsys/ridl"

[workspace.dependencies]
clap = { version = "4.6.2", features = ["derive"] }
insta = { version = "1.48.0", features = ["json"] }
logos = "0.16.1"
prettyplease = "0.2.37"
proc-macro2 = "1.0.106"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.9.1"
quote = "1.0.46"
rowan = "0.16.1"
salsa = "=0.28.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syn = { version = "2.0.119", features = ["full"] }
