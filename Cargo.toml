# RIDL compiler workspace. Members are the crates the roadmap names for
# epic E0 (docs/ROADMAP.md); E0.8 adds `backends/*`, epic E1 adds the
# `xtask` automation crate (`cargo xtask codegen`, ADR-0007 decision 1), and
# epic E1.14 adds `tools/*` (the `ridl fmt` engine, docs/ROADMAP.md).

[workspace]
resolver = "3"
members = ["crates/*", "backends/*", "tools/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/driftsys/ridl"

[workspace.dependencies]
clap = { version = "4.6.2", features = ["derive"] }
codespan-reporting = "0.13.1"
insta = { version = "1.48.0", features = ["json"] }
logos = "0.16.1"
num-bigint = "0.4.8"
num-rational = "0.4.2"
prettyplease = "0.2.37"
proc-macro2 = "1.0.106"
proptest = "1.11.0"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.9.1"
quote = "1.0.46"
regress = "0.11.1"
rowan = "0.16.1"
salsa = "=0.28.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
syn = { version = "2.0.119", features = ["full"] }
tar = "0.4.44"
toml = "1.1.3"
ungrammar = "1.16.1"
ureq = "3.1.2"
