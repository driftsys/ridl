# RIDL compiler workspace. Members are the crates the roadmap names for
# epic E0 (docs/ROADMAP.md); E0.8 adds `backends/*`.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/driftsys/ridl"

[workspace.dependencies]
logos = "0.16.1"
