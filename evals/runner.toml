# The models the eval runner pins. Each result file records the model it ran
# with. The judge of a run uses a host of the other vendor: Claude and Copilot
# runs are judged by Codex, and Codex runs are judged by the host that
# `[judge] anthropic` names, `claude` or `copilot`, with that host's model
# below. `cargo xtask eval --anthropic-judge claude|copilot` overrides it.
[claude]
model = "claude-opus-5-5"

[codex]
model = "gpt-6.1-sol"

[copilot]
model = "claude-sonnet-5.5"

[judge]
anthropic = "copilot"
