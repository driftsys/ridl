[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `cargo xtask descriptor-codegen` compiles the catalog-descriptor schema and
# generates its Rust accessors with planus (src/descriptor.rs).
planus-codegen.workspace = true
planus-translation.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
ungrammar.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# `cargo xtask freeze` dumps library data: the keyword registry and the
# diagnostic catalogues (src/freeze/keywords.rs, diagnostics.rs), and the
# protocol schemas compiled with protox (src/freeze/protocol.rs).
ridl-core.workspace = true
ridl-syntax.workspace = true
protox.workspace = true
prost-reflect.workspace = true
