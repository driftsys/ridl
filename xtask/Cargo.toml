[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `cargo xtask descriptor-codegen` compiles the catalog-descriptor schema and
# generates its Rust accessors with planus (src/descriptor.rs).
planus-codegen.workspace = true
planus-translation.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
ungrammar.workspace = true

# The dependency-boundary guard (tests/oracle_boundary.rs) parses
# `cargo metadata`'s JSON output — test-only, so it is a dev-dependency.
[dev-dependencies]
serde_json.workspace = true
