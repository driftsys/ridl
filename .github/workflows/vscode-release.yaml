name: vscode-release

# Release train for the ridl and ridlc binaries and the VS Code extension,
# triggered by an `editor-v*` tag a maintainer pushes (ADR-0007 decision 14:
# the push is the maintainer act). Builds both ridl (the porcelain CLI) and
# ridlc (the plumbing compiler front end, for CI/build-system use) for five
# targets with the tag stamped as ridl's version, packages one VSIX per target
# from the ridl binary alone, creates the GitHub Release carrying both
# binaries' tarballs, and runs the Marketplace publish in the `marketplace`
# environment, which a maintainer must configure with required reviewers. The
# release job does not depend on the publish job, so a publish failure never
# blocks the release. The publish job depends on the release job, so a failed
# signing step publishes neither the release nor the extension.
#
# Packaging runs through `just package-vsix` (ADR-0009: the justfile defines
# it; this file only invokes it), the same recipe `just package-vscode` calls
# for a local build. `just` is installed the same way `ci.yml` and
# `vscode-verify.yaml` install it.
#
# `vsce publish` is not idempotent: after a partial failure, publish the
# remaining targets by hand rather than re-running.
#
# Repository write is granted only where it is needed: the workflow default is
# read, and the `release` job raises its own permissions to create the GitHub
# Release. `ci.yml` documents the same convention (its `pages` job raises
# permissions the same way, for the same reason) and every other job here
# stays read-only, including the one that holds the Marketplace token.

on:
  push:
    tags: ["editor-v*"]

permissions:
  contents: read

env:
  NODE_VERSION: 22
  JUST_VERSION: 1.38.0

jobs:
  guard:
    name: tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare versions
        run: |
          tag="${GITHUB_REF_NAME#editor-v}"
          manifest="$(node -p "require('./editors/vscode/package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag version $tag does not match editors/vscode/package.json version $manifest" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: guard
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two Linux rows carry a glibc-floor field the other three
          # rows omit. That field selects `cargo zigbuild` with a glibc 2.28
          # floor (`--target <triple>.2.28`) instead of a plain `cargo
          # build`, so the built binary runs on glibc 2.28 or newer — a
          # floor low enough to start on Ubuntu 20.04, Debian 11, and RHEL
          # 8, rather than requiring whatever glibc ubuntu-latest ships
          # (2.39 as of this writing). The Rust triple, the output
          # directory, the tarball name, install.sh's target mapping, and
          # the VSIX layout are all unaffected: cargo places the binary at
          # `target/<matrix.target>/release/<binary>` whether the floor
          # suffix is present or not.
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              binary: ridl,
              ridlc-binary: ridlc,
              glibc-floor: "2.28",
            }
          - {
              target: aarch64-unknown-linux-gnu,
              os: ubuntu-latest,
              binary: ridl,
              ridlc-binary: ridlc,
              glibc-floor: "2.28",
            }
          - {
              target: x86_64-apple-darwin,
              os: macos-latest,
              binary: ridl,
              ridlc-binary: ridlc,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-latest,
              binary: ridl,
              ridlc-binary: ridlc,
            }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              binary: ridl.exe,
              ridlc-binary: ridlc.exe,
            }
    steps:
      - uses: actions/checkout@v4
      - name: add the target
        run: rustup target add ${{ matrix.target }}
      - name: install zig
        if: matrix.glibc-floor != ''
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: install cargo-zigbuild
        if: matrix.glibc-floor != ''
        uses: taiki-e/install-action@v2
        # 0.23.0 is a floor, not an arbitrary pin: Rust 1.98 (this repo's own
        # toolchain pin) added `--fix-cortex-a53-843419` to
        # aarch64-unknown-linux-gnu's default linker flags, which zig's `cc`
        # rejects as an unsupported linker arg — cargo-zigbuild strips it
        # starting at 0.23.0 (rust-cross/cargo-zigbuild#451). Below that
        # version, the aarch64-unknown-linux-gnu row of this matrix fails to
        # link.
        with:
          tool: cargo-zigbuild@0.23.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build ridl and ridlc
        env:
          RIDL_BUILD_VERSION: ${{ github.ref_name }}
        run: |
          if [ -n "${{ matrix.glibc-floor }}" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}.${{ matrix.glibc-floor }}" -p ridl-cli -p ridlc
          else
            cargo build --release --locked --target ${{ matrix.target }} -p ridl-cli -p ridlc
          fi
      - name: tarball and checksum
        env:
          # macOS tar stores extended attributes as separate `._` AppleDouble
          # members, and a freshly built binary can carry one, which would put
          # a stray `._ridl` inside the released tarball. Harmless on Linux
          # and Windows.
          COPYFILE_DISABLE: 1
        run: |
          out_dir="target/${{ matrix.target }}/release"
          cp LICENSE THIRD-PARTY-NOTICES.txt "$out_dir/"
          tar czf "ridl-${{ matrix.target }}.tar.gz" -C "$out_dir" "${{ matrix.binary }}" LICENSE THIRD-PARTY-NOTICES.txt
          tar czf "ridlc-${{ matrix.target }}.tar.gz" -C "$out_dir" "${{ matrix.ridlc-binary }}" LICENSE THIRD-PARTY-NOTICES.txt
          if command -v sha256sum >/dev/null; then
            sha256sum "ridl-${{ matrix.target }}.tar.gz" > "ridl-${{ matrix.target }}.tar.gz.sha256"
            sha256sum "ridlc-${{ matrix.target }}.tar.gz" > "ridlc-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "ridl-${{ matrix.target }}.tar.gz" > "ridl-${{ matrix.target }}.tar.gz.sha256"
            shasum -a 256 "ridlc-${{ matrix.target }}.tar.gz" > "ridlc-${{ matrix.target }}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ridl-${{ matrix.target }}
          path: |
            ridl-${{ matrix.target }}.tar.gz
            ridl-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ridlc-${{ matrix.target }}
          path: |
            ridlc-${{ matrix.target }}.tar.gz
            ridlc-${{ matrix.target }}.tar.gz.sha256

  package-vsix:
    name: package vsix (${{ matrix.vsce-target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              target: x86_64-unknown-linux-gnu,
              vsce-target: linux-x64,
              binary: ridl,
            }
          - {
              target: aarch64-unknown-linux-gnu,
              vsce-target: linux-arm64,
              binary: ridl,
            }
          - {
              target: x86_64-apple-darwin,
              vsce-target: darwin-x64,
              binary: ridl,
            }
          - {
              target: aarch64-apple-darwin,
              vsce-target: darwin-arm64,
              binary: ridl,
            }
          - {
              target: x86_64-pc-windows-msvc,
              vsce-target: win32-x64,
              binary: ridl.exe,
            }
    steps:
      - uses: actions/checkout@v4
      - name: install just
        # `set -o pipefail` and the closing version line for the reason ci.yml's
        # header gives: without them a failed download leaves the step green and
        # the missing tool surfaces as a confusing failure later (#395).
        run: |
          set -o pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ridl-${{ matrix.target }}
          path: artifacts
      - name: bundle the binary
        run: |
          mkdir -p editors/vscode/bin
          tar xzf "artifacts/ridl-${{ matrix.target }}.tar.gz" -C editors/vscode/bin
          chmod +x "editors/vscode/bin/${{ matrix.binary }}"
      - name: package
        run: just package-vsix ${{ matrix.vsce-target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ridl-lang-${{ matrix.vsce-target }}-vsix
          path: editors/vscode/ridl-lang-${{ matrix.vsce-target }}.vsix

  release:
    name: github release
    needs: [build, package-vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: install just
        # `set -o pipefail` and the closing version line for the reason ci.yml's
        # header gives: without them a failed download leaves the step green and
        # the missing tool surfaces as a confusing failure later (#395).
        run: |
          set -o pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # The Ubuntu package reads the key password from standard input and needs
      # no build.
      - name: install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          minisign -v
      # Only this job holds the signing secret; the build runners never see it.
      # `ridlc` archives are not signed.
      - name: sign the ridl archives
        env:
          RIDL_RELEASE_SIGNING_KEY: ${{ secrets.RIDL_RELEASE_SIGNING_KEY }}
          RIDL_RELEASE_SIGNING_KEY_PASSWORD: ${{ secrets.RIDL_RELEASE_SIGNING_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : "${RIDL_RELEASE_SIGNING_KEY:?the RIDL_RELEASE_SIGNING_KEY secret is required to sign a release}"
          : "${RIDL_RELEASE_SIGNING_KEY_PASSWORD:?the RIDL_RELEASE_SIGNING_KEY_PASSWORD secret is required to sign a release}"
          if grep -qF RIDL-RELEASE-KEY-PLACEHOLDER crates/ridl/src/toolchain/mod.rs; then
            echo "error: crates/ridl/src/toolchain/mod.rs still holds the RIDL-RELEASE-KEY-PLACEHOLDER public key; a release signed now could not be verified" >&2
            exit 1
          fi
          # The embedded public key has to decode to a minisign public key: 42
          # bytes, the algorithm `Ed`, an 8-byte key id and the 32-byte key.
          public_key="$(sed -n 's/^pub const RELEASE_PUBLIC_KEY: &str = "\(.*\)";$/\1/p' crates/ridl/src/toolchain/mod.rs)"
          decoded="$(printf '%s' "$public_key" | base64 -d 2>/dev/null | od -An -tx1 | tr -d ' \n' || true)"
          if [ "${#decoded}" != 84 ] || [ "${decoded:0:4}" != 4564 ]; then
            echo "error: the RELEASE_PUBLIC_KEY in crates/ridl/src/toolchain/mod.rs is not a minisign public key; a release signed now could not be verified" >&2
            exit 1
          fi
          version="${RELEASE_TAG#editor-v}"
          key="$(mktemp "${TMPDIR:-/tmp}/ridl-signing-key.XXXXXX")"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RIDL_RELEASE_SIGNING_KEY" > "$key"
          shopt -s nullglob
          archives=(artifacts/ridl-*.tar.gz)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "error: no ridl archive to sign in artifacts/" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            name="${archive##*/}"
            target="${name#ridl-}"
            target="${target%.tar.gz}"
            printf '%s\n' "$RIDL_RELEASE_SIGNING_KEY_PASSWORD" \
              | minisign -S -s "$key" -m "$archive" -t "ridl $version $target" -x "$archive.minisig"
          done
      # The ridl-authoring skill, for Claude Code and Codex; the VSIX already
      # carries it for GitHub Copilot.
      - name: package the skill
        run: just package-skill artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # A platform-specific editor release is not the repository's
          # headline artifact, so keep it out of the latest-release slot.
          make_latest: false
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.minisig
            artifacts/*.vsix
            artifacts/*.zip

  publish-vsce:
    name: publish to the VS Code Marketplace
    needs: [package-vsix, release]
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: vsix
          pattern: ridl-lang-*-vsix
          merge-multiple: true
      - name: install the extension's pinned tools
        run: npm ci
        working-directory: editors/vscode
      - name: publish each target
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: editors/vscode/scripts/publish-vsix.sh vsix
