name: vscode-release

# Release train for the ridl and ridlc binaries and the VS Code extension,
# triggered by an `editor-v*` tag a maintainer pushes (ADR-0007 decision 14:
# the push is the maintainer act). Builds both ridl (the porcelain CLI) and
# ridlc (the plumbing compiler front end, for CI/build-system use) for five
# targets with the tag stamped as ridl's version, packages one VSIX per target
# from the ridl binary alone, creates the GitHub Release carrying both
# binaries' tarballs, and runs the Marketplace and Open VSX publishes in the
# `marketplace` environment, which a maintainer must configure with required
# reviewers. The release job does not depend on the publish jobs, so a publish
# failure never blocks the release.
#
# Packaging runs through `just package-vsix` (ADR-0009: the justfile defines
# it; this file only invokes it), the same recipe `just package-vscode` calls
# for a local build. `just` is installed the same way `ci.yml` and
# `vscode-verify.yaml` install it.
#
# Neither `vsce publish` nor `ovsx publish` is idempotent: after a partial
# failure, publish the remaining targets by hand rather than re-running.
#
# Repository write is granted only where it is needed: the workflow default is
# read, and the `release` job raises its own permissions to create the GitHub
# Release. `ci.yml` documents the same convention (its `pages` job raises
# permissions the same way, for the same reason) and every other job here
# stays read-only, including the two that hold the Marketplace and Open VSX
# tokens.

on:
  push:
    tags: ["editor-v*"]

permissions:
  contents: read

env:
  NODE_VERSION: 22
  JUST_VERSION: 1.38.0

jobs:
  guard:
    name: tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare versions
        run: |
          tag="${GITHUB_REF_NAME#editor-v}"
          manifest="$(node -p "require('./editors/vscode/package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag version $tag does not match editors/vscode/package.json version $manifest" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: guard
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two Linux rows carry a glibc-floor field the other three
          # rows omit. That field selects `cargo zigbuild` with a glibc 2.28
          # floor (`--target <triple>.2.28`) instead of a plain `cargo
          # build`, so the built binary runs on glibc 2.28 or newer — a
          # floor low enough to start on Ubuntu 20.04, Debian 11, and RHEL
          # 8, rather than requiring whatever glibc ubuntu-latest ships
          # (2.39 as of this writing). The Rust triple, the output
          # directory, the tarball name, install.sh's target mapping, and
          # the VSIX layout are all unaffected: cargo places the binary at
          # `target/<matrix.target>/release/<binary>` whether the floor
          # suffix is present or not.
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              binary: ridl,
              ridlc-binary: ridlc,
              glibc-floor: "2.28",
            }
          - {
              target: aarch64-unknown-linux-gnu,
              os: ubuntu-latest,
              binary: ridl,
              ridlc-binary: ridlc,
              glibc-floor: "2.28",
            }
          - {
              target: x86_64-apple-darwin,
              os: macos-latest,
              binary: ridl,
              ridlc-binary: ridlc,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-latest,
              binary: ridl,
              ridlc-binary: ridlc,
            }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              binary: ridl.exe,
              ridlc-binary: ridlc.exe,
            }
    steps:
      - uses: actions/checkout@v4
      - name: add the target
        run: rustup target add ${{ matrix.target }}
      - name: install zig
        if: matrix.glibc-floor != ''
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: install cargo-zigbuild
        if: matrix.glibc-floor != ''
        uses: taiki-e/install-action@v2
        # 0.23.0 is a floor, not an arbitrary pin: Rust 1.98 (this repo's own
        # toolchain pin) added `--fix-cortex-a53-843419` to
        # aarch64-unknown-linux-gnu's default linker flags, which zig's `cc`
        # rejects as an unsupported linker arg — cargo-zigbuild strips it
        # starting at 0.23.0 (rust-cross/cargo-zigbuild#451). Below that
        # version, the aarch64-unknown-linux-gnu row of this matrix fails to
        # link.
        with:
          tool: cargo-zigbuild@0.23.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build ridl and ridlc
        env:
          RIDL_BUILD_VERSION: ${{ github.ref_name }}
        run: |
          if [ -n "${{ matrix.glibc-floor }}" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}.${{ matrix.glibc-floor }}" -p ridl-cli -p ridlc
          else
            cargo build --release --locked --target ${{ matrix.target }} -p ridl-cli -p ridlc
          fi
      - name: tarball and checksum
        env:
          # macOS tar stores extended attributes as separate `._` AppleDouble
          # members, and a freshly built binary can carry one, which would put
          # a stray `._ridl` inside the released tarball. Harmless on Linux
          # and Windows.
          COPYFILE_DISABLE: 1
        run: |
          out_dir="target/${{ matrix.target }}/release"
          tar czf "ridl-${{ matrix.target }}.tar.gz" -C "$out_dir" "${{ matrix.binary }}"
          tar czf "ridlc-${{ matrix.target }}.tar.gz" -C "$out_dir" "${{ matrix.ridlc-binary }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "ridl-${{ matrix.target }}.tar.gz" > "ridl-${{ matrix.target }}.tar.gz.sha256"
            sha256sum "ridlc-${{ matrix.target }}.tar.gz" > "ridlc-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "ridl-${{ matrix.target }}.tar.gz" > "ridl-${{ matrix.target }}.tar.gz.sha256"
            shasum -a 256 "ridlc-${{ matrix.target }}.tar.gz" > "ridlc-${{ matrix.target }}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ridl-${{ matrix.target }}
          path: |
            ridl-${{ matrix.target }}.tar.gz
            ridl-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ridlc-${{ matrix.target }}
          path: |
            ridlc-${{ matrix.target }}.tar.gz
            ridlc-${{ matrix.target }}.tar.gz.sha256

  package-vsix:
    name: package vsix (${{ matrix.vsce-target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              target: x86_64-unknown-linux-gnu,
              vsce-target: linux-x64,
              binary: ridl,
            }
          - {
              target: aarch64-unknown-linux-gnu,
              vsce-target: linux-arm64,
              binary: ridl,
            }
          - {
              target: x86_64-apple-darwin,
              vsce-target: darwin-x64,
              binary: ridl,
            }
          - {
              target: aarch64-apple-darwin,
              vsce-target: darwin-arm64,
              binary: ridl,
            }
          - {
              target: x86_64-pc-windows-msvc,
              vsce-target: win32-x64,
              binary: ridl.exe,
            }
    steps:
      - uses: actions/checkout@v4
      - name: install just
        # `set -o pipefail` and the closing version line for the reason ci.yml's
        # header gives: without them a failed download leaves the step green and
        # the missing tool surfaces as a confusing failure later (#395).
        run: |
          set -o pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ridl-${{ matrix.target }}
          path: artifacts
      - name: bundle the binary
        run: |
          mkdir -p editors/vscode/bin
          tar xzf "artifacts/ridl-${{ matrix.target }}.tar.gz" -C editors/vscode/bin
          chmod +x "editors/vscode/bin/${{ matrix.binary }}"
      - name: package
        run: just package-vsix ${{ matrix.vsce-target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ridl-lang-${{ matrix.vsce-target }}-vsix
          path: editors/vscode/ridl-lang-${{ matrix.vsce-target }}.vsix

  release:
    name: github release
    needs: [build, package-vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # A platform-specific editor release is not the repository's
          # headline artifact, so keep it out of the latest-release slot.
          make_latest: false
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.vsix

  publish-vsce:
    name: publish to the VS Code Marketplace
    needs: package-vsix
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: vsix
          pattern: ridl-lang-*-vsix
          merge-multiple: true
      - name: install the extension's pinned tools
        run: npm ci
        working-directory: editors/vscode
      - name: publish each target
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          shopt -s nullglob
          files=(vsix/*.vsix)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "::error::expected 5 VSIX files, found ${#files[@]}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "publishing $f"
            editors/vscode/node_modules/.bin/vsce publish --packagePath "$f"
          done

  publish-ovsx:
    name: publish to Open VSX
    needs: package-vsix
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: vsix
          pattern: ridl-lang-*-vsix
          merge-multiple: true
      - name: install the extension's pinned tools
        run: npm ci
        working-directory: editors/vscode
      - name: publish each target
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          shopt -s nullglob
          files=(vsix/*.vsix)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "::error::expected 5 VSIX files, found ${#files[@]}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "publishing $f"
            editors/vscode/node_modules/.bin/ovsx publish "$f"
          done
