name: ci

# CI installs tools and then runs the justfile recipes. It does not hold its own
# copy of any gate command: `just check`, `just compile`, `just test` and the
# rest are defined once, in the justfile, and both sides run that definition.
# ADR-0009 records why. Four commands had drifted between the two files —
# `--locked`, `mdbook build`, the markdownlint `--ignore` flags, and the Rust
# toolchain — and each one let a locally clean tree fail here.
#
# `just gate-parity` fails when a member of `just build` is not invoked below,
# so a member added to the local gate cannot quietly stay out of CI.

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. The gate is reproducible from a clean checkout, so a run
  # that failed for a reason outside the tree — a runner never allocated, a
  # transient install — can be retried without an empty commit to provoke it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runner-tool versions CI installs, in one place so the pins are visible
  # rather than buried in a curl URL. Both are pinned on this side only: rustup
  # applies rust-toolchain.toml to a contributor too, but nothing applies these
  # two, so a contributor runs whatever their package manager gave them.
  # ADR-0009 decision 8 records that asymmetry and why it is not closed here.
  JUST_VERSION: 1.38.0
  MDBOOK_VERSION: 0.4.40

jobs:
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install just
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install prim
        run: curl -fsSL https://raw.githubusercontent.com/driftsys/prim/main/install.sh | bash
        env:
          PRIM_INSTALL_DIR: /usr/local/bin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install markdownlint-cli
        run: npm install --global markdownlint-cli
      # Exclusions come from .markdownlintignore, which markdownlint auto-detects.
      # This job used to add `--ignore book --ignore node_modules` on top; that
      # file's own header explains why the flag form does not work, and the two
      # lists were free to disagree.
      - run: just check

  book:
    name: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install just
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just book-check
      - run: just link-check

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `dtolnay/rust-toolchain@stable`: it runs `rustup default`, which a
      # rust-toolchain.toml directory override outranks, so it would install a
      # toolchain on every run that nothing here uses. `rustup show` installs
      # the pinned toolchain with the components and targets that file names.
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: install just
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just toolchain-check
      # Needs no toolchain of its own, and has no other job to sit in.
      - run: just gate-parity
      - run: just fmt-check
      - run: just compile
      - run: just test
      - run: just lint

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: install just
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just wasm-check

  convco:
    name: convco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Lint the PR's own commits: the default pull_request checkout is a
          # synthetic merge commit, which can never pass a conventional-commit
          # lint.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: install just
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install git-std
        run: curl -fsSL https://raw.githubusercontent.com/driftsys/git-std/main/install.sh | bash
        env:
          GIT_STD_INSTALL_DIR: /usr/local/bin
      # The recipe, not a `git std lint` line of its own. This step and the
      # `verify` recipe each held one before, and they already differed: this one
      # linted against the PR's base branch and `verify` against `main`, so they
      # agreed only for PRs based on `main`.
      - name: lint commit messages against the PR base branch
        run: just lint-commits ${{ github.base_ref }}

  # Publish the rendered book to GitHub Pages: https://driftsys.github.io/ridl/
  #
  # Only on a push to main, and only behind the `ci` aggregate, so nothing is
  # published from a branch or from a run whose gate is red. A pull request
  # renders the book in the `book` job and stops there.
  #
  # `just book-build` rather than `mdbook build`: the workflow holds no copy of a
  # command the justfile defines (ADR-0009). It is not a member of `just build`,
  # so `gate-parity` neither requires this step nor is disturbed by it.
  #
  # The permissions are set here rather than at the top of the file so that the
  # gate jobs keep `contents: read` alone. The concurrency group is set here for
  # the opposite reason: the workflow's group cancels in progress, which would
  # abandon a deploy partway through, and a half-published site is not a state
  # the next push repairs on its own.
  pages:
    name: pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: install just
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just book-build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book
      - id: deploy
        uses: actions/deploy-pages@v4

  ci:
    name: ci
    if: always()
    # Every job, so a red anywhere fails the aggregate. "skipped" is accepted:
    # convco only runs on pull requests.
    needs: [markdown, book, rust, wasm, convco]
    runs-on: ubuntu-latest
    steps:
      - name: check required jobs
        run: |
          echo '${{ toJSON(needs) }}'
          for result in $(echo '${{ toJSON(needs.*.result) }}' | tr -d '[],"'); do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "a required job did not succeed: $result"
              exit 1
            fi
          done
