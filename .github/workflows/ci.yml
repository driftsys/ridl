name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install prim
        run: curl -fsSL https://raw.githubusercontent.com/driftsys/prim/main/install.sh | bash
        env:
          PRIM_INSTALL_DIR: /usr/local/bin
      - name: prim --check
        run: prim --check .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: markdownlint
        run: npx --yes markdownlint-cli '**/*.md' --ignore book --ignore node_modules

  book:
    name: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mdbook build

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  convco:
    name: convco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Lint the PR's own commits: the default pull_request checkout is a
          # synthetic merge commit, which can never pass a conventional-commit
          # lint.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: install git-std
        run: curl -fsSL https://raw.githubusercontent.com/driftsys/git-std/main/install.sh | bash
        env:
          GIT_STD_INSTALL_DIR: /usr/local/bin
      - run: git std lint --range origin/${{ github.base_ref }}..HEAD

  ci:
    name: ci
    if: always()
    # Every job, so a red anywhere fails the aggregate. "skipped" is accepted:
    # convco only runs on pull requests.
    needs: [markdown, book, rust, convco]
    runs-on: ubuntu-latest
    steps:
      - name: check required jobs
        run: |
          echo '${{ toJSON(needs) }}'
          for result in $(echo '${{ toJSON(needs.*.result) }}' | tr -d '[],"'); do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "a required job did not succeed: $result"
              exit 1
            fi
          done
