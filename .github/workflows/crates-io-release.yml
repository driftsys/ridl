name: crates-io-release

# Publishes every workspace crate whose manifest does not set `publish = false`
# to crates.io, on a `v<version>` tag a maintainer pushes — `just release`
# (git-std bump) cuts the tag; the push itself is the maintainer act (ADR-0007
# decision 14, amended 2026-09-21 and 2026-09-22). `xtask` is the one crate
# left `publish = false`: it is workspace tooling, never published. The `ridl`
# CLI publishes as `ridl-cli` (crates/ridl/Cargo.toml explains the name),
# alongside `ridl-lsp` and `ridl-mcp`, which it depends on directly — `cargo
# publish` needs every normal dependency resolvable on the registry, so the
# CLI could not publish while either stayed internal-only. The compiled
# binary is still named `ridl`, and the `editor-v*` train
# (`.github/workflows/vscode-release.yaml`) still ships it bundled with the
# VS Code extension; crates.io is now a second, direct `cargo install
# ridl-cli` path alongside it. Because this train ships no binary of its own,
# it has no build/smoke matrix — only a gate re-run before the publish step.
#
# The `publish` job's shape is driftsys/git-std's and driftsys/prim's own
# `publish` job: a shell function skips a crate already at its manifest
# version on crates.io, otherwise runs `cargo publish` and sleeps 30 seconds
# so the index updates before a dependent crate publishes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: 1.38.0
  MDBOOK_VERSION: 0.4.40

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: confirm the tag's commit is on main
        run: |
          set -euo pipefail
          release_commit=$(git rev-parse "$GITHUB_REF^{commit}")
          test "$release_commit" = "$GITHUB_SHA"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$release_commit" origin/main
      # No `dtolnay/rust-toolchain@stable`: it runs `rustup default`, which a
      # rust-toolchain.toml directory override outranks (ci.yml's own note).
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: install just
        run: |
          set -o pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      # `just build` runs every member in one recipe, unlike ci.yml's split
      # across jobs — so this one job needs every tool ci.yml provisions
      # across all of them: mdbook for book-check, prim for the trailing
      # `check` recipe.
      - name: install mdbook
        run: |
          set -o pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mdbook" --version
      - name: install prim
        # See ci.yml's own comment on this same step for the rate-limit and
        # pipefail rationale; copied verbatim rather than factored out, since
        # a reusable composite action is more indirection than two workflows
        # share this much of.
        run: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/driftsys/prim/main/install.sh | bash \
            || cargo install --git https://github.com/driftsys/prim --locked
          command -v prim
        env:
          PRIM_INSTALL_DIR: /usr/local/bin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The full local gate, re-run on the tagged commit rather than trusted
      # from its earlier run on main: a crates.io publish cannot be retracted,
      # only yanked, so the version number is spent either way.
      - run: just build

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish() {
            local crate="$1"
            # Skip if already published — by trying to publish and reading
            # cargo's own answer, not by asking a second, separate source
            # first. An earlier version of this function asked crates.io's
            # own API ahead of time and skipped when the answer matched the
            # local version; that source needs a `User-Agent` header, which
            # it never sent, so crates.io 403'd every single call, on every
            # run, silently — `curl -sf ... || true` turned the 403 into an
            # empty "not published" answer, indistinguishable from a crate
            # that genuinely was not published yet. That stayed harmless
            # only by accident, for as long as every crate this function
            # ever checked really was still unpublished; the first run to
            # reach an already-published crate (driftsys/ridl, 2026-09-22,
            # the second `v0.2.0` attempt) sent `ridl-syntax` — published
            # minutes earlier by this same workflow — through `cargo
            # publish` again. Cargo itself refused the duplicate, so nothing
            # was corrupted, but the job aborted before any crate still
            # pending got a turn. Asking cargo directly has no second source
            # to fall out of sync with in the first place.
            local pkg_version
            pkg_version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            echo "==> Publishing $crate $pkg_version"
            local output
            if output=$(cargo publish -p "$crate" 2>&1); then
              echo "$output"
              # Wait for the crate index to update before publishing
              # dependents. Only needed after an actual new publish; a
              # skipped one has already had time to propagate.
              sleep 30
              return 0
            fi
            echo "$output"
            if echo "$output" | grep -q "already exists on crates.io index"; then
              echo "==> $crate $pkg_version already published, skipping"
              return 0
            fi
            return 1
          }

          # Dependency order: a crate publishes only once crates.io already
          # has every crate it depends on. ridl-syntax, ridl-ir and ridl-rt
          # have no internal dependency and lead; ridlc depends on the rest
          # of the compiler crates. ridl-lsp and ridl-mcp depend on ridlc (and
          # not on each other, so their relative order does not matter);
          # ridl-cli — the `ridl` binary — depends on both of them plus
          # ridlc, so it is last of all.
          publish ridl-syntax
          publish ridl-ir
          publish ridl-rt
          publish ridl-loopback
          publish ridl-core
          publish ridl-sem
          publish ridl-diff
          publish ridl-fmt
          publish ridl-backend-flatbuffers
          publish ridl-backend-proto
          publish ridl-backend-rust
          publish ridl-backend-ts
          publish ridlc
          publish ridl-lsp
          publish ridl-mcp
          publish ridl-cli

          echo "==> All crates published."
