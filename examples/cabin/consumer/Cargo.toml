# The demo's program. It depends on the generated crate by path, the way an
# application outside this repository would depend on one it generated, and on
# `ridl-loopback` for the ports the face runs over.
#
# `generated/` and the workspace's other generated member,
# `generated-corpus/`, are written by `ridl build --emit rust` and are not in
# git, so this manifest resolves only after `just demo` has run both builds
# once.
[package]
name = "consumer"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The crate `ridlc` wrote. Its own manifest names `ridl-rt` with the
# `flatbuffers` feature, which is what the codec needs. Its `std` feature,
# on by default and named here so the dependency is explicit, carries the
# `blocking` module the program's round trips 5 and 6 use, and forwards to
# `ridl-rt/std`.
veh_cabin = { path = "../generated", features = ["std"] }
# The in-process runtime (ADR-0020 decision 6). Reached by path: it is a crate
# of this repository, and the demo is meant to run against this tree's copy.
ridl-loopback = { path = "../../../crates/ridl-loopback" }
# Named directly for `CatalogRef`, `CatalogHash`, `Provenance` and
# `ProviderError`, and for `ridl_rt::task::noop_waker`, which the `std`
# feature gates: the program polls the generated async client's futures by
# hand, the way a frame loop does. The `[patch.crates-io]` block in
# `examples/cabin/Cargo.toml` resolves this to `crates/ridl-rt`.
ridl-rt = { version = "0.6", features = ["std"] }
