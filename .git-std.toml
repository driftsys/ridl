#:schema https://driftsys.github.io/git-std/schemas/v1/git-std.schema.json
# git-std configuration for the RIDL specification repository.
# Conventional commits, semver, changelog, and git-hook management — one
# binary (`git std`). See https://github.com/driftsys/git-std.

scheme = "semver"
strict = true

# Explicit scopes rather than "auto": auto-discovery would read scopes off
# a single Cargo/npm/Deno workspace, and this repo spans both the docs tree
# and the Cargo workspace (docs/ROADMAP.md, epic E0). This list is now in
# sync with the workspace — keep it that way as new crates land.
scopes = [
  # per-language specifications
  "typl",
  "ridl",
  "uxdl",
  "rmdl",
  "rsdl",
  # cross-cutting spec (overview, concept note, general form)
  "family",
  # the implementation backlog
  "roadmap",
  # architecture decision records
  "adr",
  # repo-wide: tooling, community files, layout
  "repo",
  "docs",
  "ci",
  "hooks",
  "deps",
  # compiler workspace crates (docs/ROADMAP.md, epics E0–E2 — `ridl-backend-ts`
  # is E2.6 and `ridl-diff` is E2.8). The `ridl` crate is not repeated here; it
  # takes the `ridl` scope listed above with the language it drives.
  "ridl-syntax",
  "ridl-core",
  "ridl-ir",
  "ridlc",
  "ridl-backend-rust",
  "ridl-backend-ts",
  "ridl-diff",
  "ridl-fmt",
  "xtask",
  "ridl-sem",
  "ridl-lsp",
  # editor integrations (docs/ROADMAP.md, epic E1.17)
  "editors",
]
types = [
  "feat",
  "fix",
  "docs",
  "style",
  "refactor",
  "perf",
  "test",
  "chore",
  "ci",
  "build",
  "revert",
]

[versioning]
tag_prefix = "v"
