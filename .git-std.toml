#:schema https://driftsys.github.io/git-std/schemas/v1/git-std.schema.json
# git-std configuration for the RIDL specification repository.
# Conventional commits, semver, changelog, and git-hook management — one
# binary (`git std`). See https://github.com/driftsys/git-std.

scheme = "semver"
strict = true

# Explicit scopes rather than "auto": auto-discovery would read scopes off
# a single Cargo/npm/Deno workspace, and this repo spans both the docs tree
# and the Cargo workspace (docs/ROADMAP.md, epic E0). This list is now in
# sync with the workspace — keep it that way as new crates land.
scopes = [
  # per-language specifications
  "typl",
  "ridl",
  # `rxdl` replaced `uxdl` when ADR-0012 retired uxdl as a family member. The
  # retired reference lives at docs/archive/ and takes the `docs` scope.
  "rxdl",
  "rmdl",
  "rsdl",
  # cross-cutting spec (overview, concept note, general form)
  "family",
  # the implementation backlog
  "roadmap",
  # architecture decision records
  "adr",
  # repo-wide: tooling, community files, layout
  "repo",
  # the agent skill under skills/ (ADR-0005 Layer A)
  "skills",
  "docs",
  "ci",
  "hooks",
  "deps",
  # compiler workspace crates (docs/ROADMAP.md, epics E0–E2 — `ridl-backend-ts`
  # is E2.6 and `ridl-diff` is E2.8). The `ridl` crate is not repeated here; it
  # takes the `ridl` scope listed above with the language it drives.
  "ridl-syntax",
  "ridl-core",
  "ridl-ir",
  "ridl-descriptor",
  "ridlc",
  "ridl-backend-rust",
  "ridl-backend-ts",
  "ridl-backend-proto",
  "ridl-backend-flatbuffers",
  "ridl-diff",
  "ridl-fmt",
  "xtask",
  "ridl-sem",
  "ridl-lsp",
  # the MCP server (docs/ROADMAP.md, epic E8.6; ADR-0005 Layer B)
  "ridl-mcp",
  # the runtime library generated code links (docs/ROADMAP.md, E11.0)
  "ridl-rt",
  # the in-process reference runtime (docs/ROADMAP.md, E11.15;
  # ADR-0020 decision 6)
  "ridl-loopback",
  # the WebSocket binding of the ridl frame (docs/ROADMAP.md, E11.9;
  # docs/design/ridl-transport-ws.md)
  "ridl-transport-ws",
  # the TypeScript client of the same binding (packages/ridl-transport-ws/)
  "ts-transport-ws",
  # the port contract tests any runtime runs (docs/ROADMAP.md,
  # E11.20; ADR-0020 decision 6)
  "ridl-rt-conformance",
  # the reference codegen plugins, test-only (docs/ROADMAP.md, E4.5b;
  # ADR-0020 decisions 10 and 11)
  "ridlc-gen-model",
  "ridlc-gen-rust",
  # editor integrations (docs/ROADMAP.md, epic E1.17)
  "editors",
]
types = [
  "feat",
  "fix",
  "docs",
  "style",
  "refactor",
  "perf",
  "test",
  "chore",
  "ci",
  "build",
  "revert",
]

[versioning]
tag_prefix = "v"

# Version pins written in prose. `git std bump` replaces the first capture
# group of the first match with the new version, and skips a file or a
# pattern that does not match without an error, so
# crates/ridlc/tests/prose_version_pins.rs checks that each pin is present
# and equal to the workspace version.
[[version_files]]
path = "crates/ridl-rt-conformance/README.md"
regex = 'ridl-rt-conformance = "=([^"]+)"'

[[version_files]]
path = "docs/book/writing-a-port.md"
regex = '(?m)^ridl-rt = "([^"]+)"'

[[version_files]]
path = "docs/book/writing-a-port.md"
regex = 'ridl-rt-conformance = "=([^"]+)"'

[[version_files]]
path = "skills/ridl-authoring/SKILL.md"
regex = '(?m)^  version: "([^"]+)"'

[[version_files]]
path = "docs/book/running-a-program.md"
regex = '(?m)^ridl-loopback = "([^"]+)"'

[[version_files]]
path = "docs/book/running-a-program.md"
regex = '(?m)^ridl-rt = \{ version = "([^"]+)"'
